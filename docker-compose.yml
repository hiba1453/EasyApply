
services:
  postgres:
    container_name: easyapply_postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hibabalhirch1
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: easyapply_db
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks: 
      - easyapply
    restart: unless-stopped

  backend:
    build: ./EasyApply # <-- updated folder name
    container_name: easy_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/easyapply_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Hibabalhirch1
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - 8090:8090
    depends_on:
      - postgres
    networks:
      - easyapply

  frontend:
    build: ./easyapply-frontend # <-- updated folder name
    container_name: easy_frontend
    ports:
      - 5173:5173
    
    networks:
      - easyapply

networks:
  easyapply:
    driver: bridge

volumes:
  postgres:
    driver: local