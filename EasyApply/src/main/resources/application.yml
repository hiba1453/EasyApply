server:
  port: 8090

spring:
  application:
    name: easyapply-backend
  
  # Configuration PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/easyapply_db
    username: postgres
    password: Hibabalhirch1  # Remplace par ton mot de passe PostgreSQL
    driver-class-name: org.postgresql.Driver
  
  # Configuration JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update  # create-drop pour dev, update pour prod
    show-sql: true  # Afficher les requêtes SQL dans les logs
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

    session:
      store-type: jdbc
      timeout: 30m
      jdbc:
       initialize-schema: always
  
  # Configuration OAuth2 LinkedIn
  
  
  # Configuration upload de fichiers
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuration JWT
jwt:

  secret: ${JWT_SECRET:easyApplySecretKey12345678901234567890123456789012345}
  expiration: 86400000  # 24 heures en millisecondes

# Configuration Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Configuration des logs
logging:
  level:
    com.easyapply: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG


